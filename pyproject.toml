[project]
name = "kb-llamaindex"
version = "0.0.1"
description = "Greenfield LlamaIndex-based agentic RAG prototype"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core LlamaIndex (0.13+ for AgentWorkflow, PropertyGraphIndex with
    # SchemaLLMPathExtractor, IngestionPipeline cache abstractions).
    # Sub-package upper bounds left open — uv picks newest versions
    # compatible with core 0.13.
    "llama-index-core>=0.13,<0.14",
    "llama-index-vector-stores-milvus>=0.7",
    "llama-index-graph-stores-neo4j>=0.5",
    "llama-index-readers-file>=0.4",
    "llama-index-embeddings-openai-like>=0.1",
    "llama-index-llms-openai-like>=0.4",
    "llama-index-retrievers-bm25>=0.5",
    "llama-index-postprocessor-sbert-rerank>=0.4",

    # Web layer
    "fastapi>=0.115,<0.140",
    "uvicorn[standard]>=0.32,<0.50",
    "python-multipart>=0.0.20,<0.1",

    # Workflow engine
    "temporalio>=1.8,<2",

    # Ingest-queue backend (Track B, INGEST_QUEUE_BACKEND=rabbitmq) — async
    # AMQP client for the RabbitMQ producer/consumer that fronts admission.
    "aio-pika>=9.4,<10",

    # Storage clients
    "psycopg[binary,pool]>=3.2,<4",
    "pymilvus>=2.4,<3",
    "neo4j>=5.27,<7",
    "python-igraph>=0.11,<0.12",
    "leidenalg>=0.10,<0.11",
    "minio>=7.2,<8",
    # Wikibase REST + bot API client.
    "wikibaseintegrator>=0.12,<1.0",

    # DI + config + logging
    "dishka>=1.5,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "loguru>=0.7,<1",
    "tenacity>=9,<10",

    # Identifier canonicalization (Stage 7) — pin now to lock the
    # cross-project portability with enterprise-kb's identifier layer.
    "phonenumbers>=9,<10",
    "dateparser>=1.2,<2",

    # HTTP client — used by src/observability/litellm_models.py to
    # probe the LiteLLM proxy /v1/models endpoint at worker / API boot.
    # Previously only in [dev] which was a latent bug for prod installs.
    "httpx>=0.27,<1",

    # MCP servers (Model Context Protocol) for OpenWebUI / Claude
    # Desktop / Cursor / Continue integration.  Two servers under
    # src/mcp/: search_server (kb_search via Temporal SearchWorkflow)
    # and tools_server (7 atomic retrieval primitives in-process).
    "fastmcp>=3.0,<4",

    # Transitive via authlib (fastmcp auth), pinned explicitly: the
    # cryptography >=47 aarch64 wheels use CPU instructions the Docker
    # Desktop VM doesn't expose — Rust binding dies with SIGILL at import
    # (mcp-search/mcp-tools crash-loop, exit 132).  47.0.0/48.0.0 verified
    # broken, 44.0.3/45.0.7/46.0.5 verified OK on this host.
    "cryptography>=44,<47",

    # NebulaGraph client — the sole graph backend post-cutover (GRAPH_BACKEND
    # default = nebula). Pinned to the 3.8 line to match the cluster (v3.8.x).
    # Was previously only in the dev .venv (ad-hoc), which broke the prod image.
    "nebula3-python>=3.8,<3.9",
]

[project.optional-dependencies]
# libpostal Python bindings — requires system libpostal-dev. Installs
# fail without the C library, so kept optional. Stage 7 falls back to
# rule-based normalisation when this isn't installed.
postal = ["postal>=1.1,<2"]

# GLiNER span-NER model + deps — heavy (transformers/torch). Kept
# optional; only needed for the opt-in ``gliner`` / ``gliner+llm``
# extractor modes. The default ``lightrag`` path never imports it.
gliner = ["gliner>=0.2.13"]

# BGE cross-encoder reranker deps — sentence-transformers + torch. Heavy, so
# kept optional (api/ingest stay slim); the SEARCH worker installs it (build
# with APP_EXTRAS=rerank) for the unified graph+vector rerank pass
# (SentenceTransformerRerank on BAAI/bge-reranker-v2-m3). torch is pinned to
# CPU wheels via [tool.uv.sources] below — no CUDA/nvidia-cu12 bloat on the
# GPU-less worker.
rerank = ["sentence-transformers>=3,<6", "torch>=2,<3"]

# Telethon (Telegram MTProto client) — only needed by the tg_ingest test
# harness (TG -> ingest), not by core runtime. Kept optional.
tg = ["telethon>=1.36,<2"]

# aiogram — Telegram Bot API framework for the Q&A bot (src/bot). Only the
# `bot` service image needs it; api/worker stay slim.
bot = ["aiogram>=3,<4"]

dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<0.30",
    "ruff>=0.7,<1",
]

[tool.uv.sources]
# CPU-only torch on the Linux deploy target (worker has no GPU) — avoids
# pulling the ~5-7 GB nvidia-cu12 CUDA stack. Other platforms (e.g. macOS
# used for locking) resolve torch from PyPI, which is already CPU-only.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line length — covered by formatter
    "B008",  # FastAPI Depends() pattern triggers it falsely
    # ambiguous-unicode: false positives on legitimate Cyrillic in a
    # Russian-language corpus (entity names, doc text, examples).
    "RUF001", "RUF002", "RUF003",
]
