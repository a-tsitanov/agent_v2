# Production stack — the WHOLE app (api + worker + mcp) plus its backing
# services, EXCEPT litellm + ollama, which run on separate/external hosts.
# Point the app at them via LITELLM_BASE_URL (see .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml up -d            # core stack
#   docker compose -f docker-compose.prod.yml --profile wikibase up -d
#
# All app↔backend traffic uses compose-internal DNS (service names); only
# operator-facing ports are published.

x-app-env: &app-env
  # ── backends (compose-internal DNS) ──
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
  MILVUS_HOST: milvus
  MILVUS_PORT: "19530"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-kb_llamaindex}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  TEMPORAL_HOST: temporal
  TEMPORAL_PORT: "7233"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  # ── LLM proxy: EXTERNAL (litellm/ollama not in this compose) ──
  LITELLM_BASE_URL: ${LITELLM_BASE_URL:?set LITELLM_BASE_URL to the external proxy}
  LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-litellm-stub}
  # ── Redis LLM cache (consumed once feature/redis-llm-cache merges) ──
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # ── API + metrics ──
  API_ENV: ${API_ENV:-production}
  API_LOG_JSON: ${API_LOG_JSON:-true}
  API_CORS_ORIGINS: ${API_CORS_ORIGINS:?set allowed origin(s) for prod, e.g. https://app.example.com}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  API_KEYS: ${API_KEYS:-changeme-key}
  METRICS_ENABLED: "true"
  METRICS_BIND_ADDRESS: 0.0.0.0:9090
  # ── Models / embeddings — MUST match the external proxy + Milvus.
  #    MILVUS_DIM must equal the embedding model's native dim or inserts fail. ──
  MILVUS_DIM: ${MILVUS_DIM:-1536}
  LITELLM_MODEL_SMALL: ${LITELLM_MODEL_SMALL:-gpt-4o-mini}
  LITELLM_MODEL_LARGE: ${LITELLM_MODEL_LARGE:-gpt-4o-mini}
  LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL:-text-embedding-3-small}
  # ── Concurrency model (K+N): N = max concurrent LLM calls,
  #    K = max in-flight documents (admission, always on). ──
  LLM_POOL_N: ${LLM_POOL_N:-8}
  INGEST_ADMISSION_MAX_INFLIGHT: ${INGEST_ADMISSION_MAX_INFLIGHT:-1}
  # ── Ingest backlog backend (Track B).  `temporal` (default) = singleton
  #    IngestSchedulerWorkflow.  Set `rabbitmq` AND start the `rabbitmq`
  #    compose profile to move the backlog to RabbitMQ — the ingest-consumer
  #    then admits at prefetch=K (= INGEST_ADMISSION_MAX_INFLIGHT). ──
  INGEST_QUEUE_BACKEND: ${INGEST_QUEUE_BACKEND:-temporal}
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
  ANALYTICS_ENV_NAME: ${ANALYTICS_ENV_NAME:-prod}
  # ── Optional feature toggles (off / conservative by default; flip to enable) ──
  CLASSIFIER_ENABLED: ${CLASSIFIER_ENABLED:-false}
  AGENT_ER_USE_NATIVE_VECTOR_KNN: ${AGENT_ER_USE_NATIVE_VECTOR_KNN:-false}
  AGENT_COMMUNITY_MAX_LEVELS: ${AGENT_COMMUNITY_MAX_LEVELS:-1}
  AGENT_COMMUNITY_DYNAMIC_SELECTION: ${AGENT_COMMUNITY_DYNAMIC_SELECTION:-lexical}
  # ── Temporal worker concurrency (per-queue slot isolation — NOT the LLM
  #    throttle; that is LLM_POOL_N.  Keep the LLM/merge queues >= LLM_POOL_N
  #    so the in-process pool stays the binding limit.  Raise for more prod
  #    throughput; all overridable here). ──
  TEMPORAL_ACTIVITY_CONCURRENCY: ${TEMPORAL_ACTIVITY_CONCURRENCY:-4}
  TEMPORAL_LLM_ACTIVITY_CONCURRENCY: ${TEMPORAL_LLM_ACTIVITY_CONCURRENCY:-18}
  TEMPORAL_MERGE_ACTIVITY_CONCURRENCY: ${TEMPORAL_MERGE_ACTIVITY_CONCURRENCY:-14}
  TEMPORAL_SEARCH_ACTIVITY_CONCURRENCY: ${TEMPORAL_SEARCH_ACTIVITY_CONCURRENCY:-4}
  TEMPORAL_LARGE_ACTIVITY_CONCURRENCY: ${TEMPORAL_LARGE_ACTIVITY_CONCURRENCY:-2}
  TEMPORAL_GRAPH_BUILD_ACTIVITY_CONCURRENCY: ${TEMPORAL_GRAPH_BUILD_ACTIVITY_CONCURRENCY:-2}
  # ── Wiki editor + Wikibase (bring up the `wikibase` compose profile, then
  #    flip the two ENABLED flags — the connection vars below already point
  #    at the compose-internal services, no localhost overrides needed). ──
  WIKI_ENABLED: ${WIKI_ENABLED:-false}
  WIKI_DOCS_BASE_URL: ${WIKI_DOCS_BASE_URL:-http://api:8000/api/v1}
  WIKI_MEDIAWIKI_API_URL: ${WIKI_MEDIAWIKI_API_URL:-http://wikibase/w/api.php}
  WIKI_SITE_GLOBAL_ID: ${WIKI_SITE_GLOBAL_ID:-kbwiki}
  WIKIBASE_ENABLED: ${WIKIBASE_ENABLED:-false}
  WIKIBASE_BASE_URL: ${WIKIBASE_BASE_URL:-http://wikibase}
  WIKIBASE_BOT_USER: ${WIKIBASE_BOT_USER:-KbBot}
  WIKIBASE_BOT_PASSWORD: ${WIKIBASE_BOT_PASSWORD:-botpass}
  WIKIBASE_LANGUAGE: ${WIKIBASE_LANGUAGE:-ru}

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile

services:

  # ───────────────────────── application ─────────────────────────────
  # One-shot: creates Postgres tables, MinIO bucket, and Temporal
  # search-attributes before the api/worker start.  Idempotent — safe to
  # re-run on every fresh boot.
  init:
    <<: [*app-build]
    command: ["python", "-m", "scripts.setup_db"]
    environment: *app-env
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      milvus: {condition: service_healthy}
      minio: {condition: service_healthy}
      temporal: {condition: service_started}

  api:
    <<: [*app-build]
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      milvus: {condition: service_healthy}
      temporal: {condition: service_started}
      init: {condition: service_completed_successfully}
    restart: unless-stopped

  # All 7 worker pools in one container (launcher forks one process per
  # pool, each binding 9090+index).  Split via WORKER_GROUPS into multiple
  # services for independent scaling (e.g. a GPU host running only `llm`).
  worker:
    <<: [*app-build]
    command: ["python", "-m", "src.workflow.worker"]
    environment:
      <<: *app-env
      WORKER_GROUPS: ${WORKER_GROUPS:-}
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      milvus: {condition: service_healthy}
      temporal: {condition: service_started}
      init: {condition: service_completed_successfully}
    restart: unless-stopped

  # Ingest-queue consumer (Track B).  Opt-in: only starts under the
  # `rabbitmq` profile.  Pulls ingest.pending at prefetch=K and starts a
  # DocumentIngestWorkflow per message, awaiting completion before ack —
  # so prefetch is the admission ceiling (replaces IngestSchedulerWorkflow
  # when INGEST_QUEUE_BACKEND=rabbitmq).
  ingest-consumer:
    <<: [*app-build]
    profiles: ["rabbitmq"]
    command: ["python", "-m", "src.ingest_queue.consumer"]
    environment: *app-env
    depends_on:
      temporal: {condition: service_started}
      rabbitmq: {condition: service_healthy}
      worker: {condition: service_started}
      init: {condition: service_completed_successfully}
    restart: unless-stopped

  mcp-search:
    <<: [*app-build]
    command: ["python", "-m", "src.mcp.search_server", "--transport", "http", "--port", "9001"]
    environment: *app-env
    ports:
      - "${MCP_SEARCH_PORT:-9001}:9001"
    depends_on:
      temporal: {condition: service_started}
    restart: unless-stopped

  mcp-tools:
    <<: [*app-build]
    command: ["python", "-m", "src.mcp.tools_server", "--transport", "http", "--port", "9002"]
    environment: *app-env
    ports:
      - "${MCP_TOOLS_PORT:-9002}:9002"
    depends_on:
      neo4j: {condition: service_healthy}
      milvus: {condition: service_healthy}
    restart: unless-stopped

  # ───────────────────────── backing services ────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # RabbitMQ ingest backlog (Track B).  Opt-in via the `rabbitmq` profile;
  # management UI on 15672.  Set credentials to match RABBITMQ_URL.
  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
        -advertise-client-urls=http://127.0.0.1:2379
        -listen-client-urls=http://0.0.0.0:2379
        --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      # Current MinIO honors MINIO_ROOT_USER/PASSWORD; the old
      # MINIO_ACCESS_KEY/SECRET_KEY are ignored → a rotated prod cred was
      # silently dropped (MinIO stayed on default minioadmin), then the app
      # and Milvus could not authenticate.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Milvus must authenticate to MinIO with the SAME creds (else, after a
      # MinIO cred rotation, rootcoord/datacoord crash on object-storage init
      # and never register → "failed to get client address: find no available
      # rootcoord" loops forever).  Env names per milvus.yaml.
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-enterprise
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      # Track A (write-contention tune). Heap initial==max avoids the GC
      # pauses that heap resizing causes under sustained write load
      # (Neo4j's own recommendation). Pagecache should hold the store +
      # indexes so concurrent MERGEs don't fault to disk — 1G was far too
      # small for a 250k+-entity graph; bump per actual store size.
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-4G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-4G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-4G}"
      # Bound how long a transaction waits on a write-lock before it
      # throws a RETRYABLE Neo.TransientError instead of hanging until the
      # activity's heartbeat_timeout (the merge/graph "freeze"). Paired
      # with the A3 deadlock/transient retry wrapper on the write path.
      NEO4J_db_lock_acquisition_timeout: "${NEO4J_LOCK_TIMEOUT:-30s}"
      # NOTE: do NOT set db.transaction.timeout here. A small value (we
      # briefly tried 120s) TERMINATES legitimate large inject_canonical /
      # upsert transactions that run long under hub-node contention
      # ("transaction has not completed within the timeout … terminated").
      # The activity is already bounded by Temporal (start_to_close=1h +
      # heartbeat=2m); a redundant server-side ceiling only adds a failure
      # mode. Override NEO4J_TX_TIMEOUT in .env ONLY if you want one, and
      # keep it well above the activity start_to_close.
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb_llamaindex}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Connection-budget tuning.  The stock image ships max_connections=100,
    # which a single shared instance cannot satisfy: Temporal (per-service
    # SQL_MAX_CONNS=20 + SQL_VIS_MAX_CONNS=10, several services) alone can
    # demand >100, before the app's pool.  Raise the ceiling and size the
    # caches for the 32+-core / RAM-rich host.  Budget at 300:
    # Temporal (capped below) + app pool (~10 procs x POSTGRES_POOL_MAX_SIZE)
    # + grafana/misc, with headroom.  Recreate the container to apply.
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kb_llamaindex}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NOTE (prod hardening): auto-setup re-runs schema setup on every boot.
  # A hardened deploy runs `temporalio/server` + a one-time
  # `temporal-sql-tool` schema migration, and gives Temporal its OWN
  # Postgres (it's history-write-heavy).  Kept as auto-setup here for a
  # turnkey bring-up.
  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      NUM_HISTORY_SHARDS: ${TEMPORAL_NUM_HISTORY_SHARDS:-512}
      # Explicit, BOUNDED persistence pools (auto-setup defaults: 20/20 main,
      # 10/10 visibility — per service, several services → easily >100 conns).
      # Pin them so the connection budget against Postgres max_connections is
      # visible and tunable instead of drifting on stock defaults.
      SQL_MAX_CONNS: ${TEMPORAL_SQL_MAX_CONNS:-30}
      SQL_MAX_IDLE_CONNS: ${TEMPORAL_SQL_MAX_IDLE_CONNS:-10}
      SQL_VIS_MAX_CONNS: ${TEMPORAL_SQL_VIS_MAX_CONNS:-15}
      SQL_VIS_MAX_IDLE_CONNS: ${TEMPORAL_SQL_VIS_MAX_IDLE_CONNS:-5}
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_UI_CORS:-http://localhost:3000}
      # Keep the CSRF cookie Secure (default false) when the UI is served over
      # HTTPS; set TEMPORAL_UI_CSRF_COOKIE_INSECURE=true only if reached over
      # plain HTTP (else POST actions fail with "CSRF token missing in headers").
      TEMPORAL_CSRF_COOKIE_INSECURE: ${TEMPORAL_UI_CSRF_COOKIE_INSECURE:-false}
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "${PROMETHEUS_PORT:-9092}:9090"
    volumes:
      - ./infra/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus: {condition: service_started}
      postgres: {condition: service_healthy}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      POSTGRES_DB: ${POSTGRES_DB:-kb_llamaindex}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  # ── Wikibase stack (opt-in: --profile wikibase) ─────────────────────
  wikibase-mysql:
    image: mariadb:11.4
    profiles: ["wikibase"]
    environment:
      MYSQL_DATABASE: my_wiki
      MYSQL_USER: wikiuser
      MYSQL_PASSWORD: ${WIKIBASE_DB_PASSWORD:-sqlpass}
      MYSQL_ROOT_PASSWORD: ${WIKIBASE_DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - wikibase_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wikibase:
    image: wikibase/wikibase-bundle:1.41.1-wmde.20
    profiles: ["wikibase"]
    ports:
      - "${WIKIBASE_HOST_PORT:-8181}:80"
    environment:
      DB_SERVER: wikibase-mysql:3306
      MW_ADMIN_NAME: ${WIKIBASE_ADMIN_USER:-WikibaseAdmin}
      MW_ADMIN_PASS: ${WIKIBASE_ADMIN_PASS:-ChangeMe-Wb-Admin-2026}
      MW_ADMIN_EMAIL: admin@example.invalid
      MW_WG_SECRET_KEY: ${WIKIBASE_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeef}
      MW_WG_DEFAULT_SKIN: vector
      # Content language — match WIKIBASE_LANGUAGE the app uses (ru).  The
      # image defaults to 'en' if unset.
      MW_SITE_LANG: ${WIKIBASE_LANGUAGE:-ru}
      DB_USER: wikiuser
      DB_PASS: ${WIKIBASE_DB_PASSWORD:-sqlpass}
      DB_NAME: my_wiki
      WIKIBASE_PINGBACK: "false"
    depends_on:
      wikibase-mysql: {condition: service_healthy}
    volumes:
      - wikibase_images:/var/www/html/images
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/wiki/Special:Version", "-o", "/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  wdqs:
    image: wikibase/wdqs:0.3.137-wmde.20
    profiles: ["wikibase"]
    ports:
      - "${WIKIBASE_WDQS_PORT:-8989}:9999"
    environment:
      WIKIBASE_HOST: wikibase
    depends_on:
      wikibase: {condition: service_healthy}
    volumes:
      - wikibase_wdqs_data:/wdqs/data
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  neo4j_logs:
  pg_data:
  wikibase_mysql_data:
  wikibase_images:
  wikibase_wdqs_data:
  prometheus_data:
  grafana_data:
