services:

  # ── Infrastructure: etcd (Milvus metadata) ──────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
        -advertise-client-urls=http://127.0.0.1:2379
        -listen-client-urls=http://0.0.0.0:2379
        --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Infrastructure: MinIO (Milvus object storage) ───────────────────
  minio:
    image: minio/minio:latest
    environment:
      # Current MinIO honors MINIO_ROOT_USER/PASSWORD; the old
      # MINIO_ACCESS_KEY/SECRET_KEY are ignored → rotated creds were silently
      # dropped (MinIO stayed on default minioadmin).  Source value from the
      # same ${MINIO_ACCESS_KEY} the app/Milvus use so all three match.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Vector DB: Milvus standalone ────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Milvus must authenticate to MinIO with the SAME creds (else, after a
      # MinIO cred rotation, rootcoord/datacoord crash on object-storage init
      # and never register → "failed to get client address: find no available
      # rootcoord" loops forever).  Env names per milvus.yaml.
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Graph DB: Neo4j Enterprise (Stage 6) ────────────────────────────
  neo4j:
    image: neo4j:5-enterprise
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # graph-data-science (GDS) added for community detection (Plan #2 R6:
      # CommunityBuildWorkflow runs gds.leiden). Leiden ships in the open
      # GDS library, so Community GDS on Neo4j Enterprise is sufficient.
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # GDS + APOC procedures must be allow-listed to be callable.
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      # Leiden on a large KG is memory-hungry — the GDS undirected
      # projection holds every edge in BOTH directions in JVM heap, so a
      # 1G cap OOMs ("Java heap space") on real graphs.  Defaults bumped
      # and made env-overridable; size to the host (Neo4j wants roughly
      # heap_max + pagecache free RAM — ~6G for these defaults).  Drop them
      # for a tiny dev box, raise for a large corpus.
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-4G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Wikibase: structured-data store (Wikidata-software stack) ───
  # MySQL backs Wikibase's MediaWiki schema.
  wikibase-mysql:
    image: mariadb:11.4
    environment:
      MYSQL_DATABASE: my_wiki
      MYSQL_USER: wikiuser
      MYSQL_PASSWORD: ${WIKIBASE_DB_PASSWORD:-sqlpass}
      MYSQL_ROOT_PASSWORD: ${WIKIBASE_DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - wikibase_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wikibase:
    image: wikibase/wikibase-bundle:1.41.1-wmde.20
    ports:
      - "${WIKIBASE_HOST_PORT:-8181}:80"
    environment:
      DB_SERVER: wikibase-mysql:3306
      MW_ADMIN_NAME: ${WIKIBASE_ADMIN_USER:-WikibaseAdmin}
      MW_ADMIN_PASS: ${WIKIBASE_ADMIN_PASS:-ChangeMe-Wb-Admin-2026}
      MW_ADMIN_EMAIL: admin@example.invalid
      MW_WG_SECRET_KEY: ${WIKIBASE_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeef}
      MW_WG_DEFAULT_SKIN: vector
      # Content language — match WIKIBASE_LANGUAGE the app uses (ru).  The
      # image defaults to 'en' if unset.
      MW_SITE_LANG: ${WIKIBASE_LANGUAGE:-ru}
      DB_USER: wikiuser
      DB_PASS: ${WIKIBASE_DB_PASSWORD:-sqlpass}
      DB_NAME: my_wiki
      WIKIBASE_PINGBACK: "false"
    depends_on:
      wikibase-mysql:
        condition: service_healthy
    volumes:
      - wikibase_images:/var/www/html/images
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/wiki/Special:Version", "-o", "/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  wdqs:
    image: wikibase/wdqs:0.3.137-wmde.20
    ports:
      - "${WIKIBASE_WDQS_PORT:-8989}:9999"
    environment:
      WIKIBASE_HOST: wikibase
    depends_on:
      wikibase:
        condition: service_healthy
    volumes:
      - wikibase_wdqs_data:/wdqs/data
    restart: unless-stopped

  # ── Relational DB: PostgreSQL 16 ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kb_llamaindex}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kb_llamaindex}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Workflow engine: Temporal ──────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # History shard count — the single biggest throughput knob. IMMUTABLE
      # after the cluster's first init (persisted in the DB), so this only
      # takes effect on a FRESH cluster (empty temporal/temporal_visibility
      # DBs). 512 is the Temporal-recommended prod floor; the auto-setup
      # image otherwise defaults to 4 (dev-scale). Override for a small dev
      # box with TEMPORAL_NUM_HISTORY_SHARDS=4.
      NUM_HISTORY_SHARDS: ${TEMPORAL_NUM_HISTORY_SHARDS:-512}
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # ── PROD HARDENING (decisions, NOT auto-applied — they're not reversible
    #    in place) ───────────────────────────────────────────────────────
    # * `auto-setup` runs schema-setup + namespace registration on every
    #   boot — it's the quickstart image. A hardened prod runs
    #   `temporalio/server` and migrates schema ONCE via `temporal-sql-tool`
    #   (the admin-tools image), instead of re-running setup each start.
    # * Temporal shares the app `postgres` instance here (separate DBs). It
    #   is history-write-heavy; for prod give it its OWN Postgres so it
    #   doesn't contend with application IO/connections.
    # * Bumping this image (1.25.2 → newer) implies a Temporal schema
    #   upgrade — run it against a DB copy first; never bump in place on a
    #   prod cluster with live data.

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  # ── LLM proxy: LiteLLM (OpenAI-compatible front-door) ───────────────
  # Routes all LLM and embedding calls.  Default config uses OpenAI
  # upstream — adjust docker/litellm_config.yaml for production.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./docker/litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-litellm-stub}
      # Pass the host OPENAI_API_KEY into the container so the
      # `os.environ/OPENAI_API_KEY` refs in
      # docker/litellm_config.yaml resolve at runtime.  Leave the
      # host value empty when proxying to a local model instead.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\", timeout=2).read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Metrics + dashboards ────────────────────────────────────────────
  # Prometheus scrapes the Temporal Python worker (Stage 2) plus the
  # Temporal Server's own /metrics endpoint.  Worker runs on the host
  # (uv run python -m src.workflow.worker) — host.docker.internal +
  # extra_hosts host-gateway covers both Docker Desktop and Linux.
  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "${PROMETHEUS_PORT:-9092}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_INSTALL_PLUGINS: ""
      # Datasource provisioning reads ${POSTGRES_*} via shell expansion;
      # pass through so /etc/grafana/provisioning/datasources/datasources.yaml
      # resolves the Postgres connection string at container start.
      POSTGRES_DB: ${POSTGRES_DB:-kb_llamaindex}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  # ── One-shot schema initialiser (opt-in; never pulled in by default) ──
  # Run with:  docker compose --profile init up init
  # Idempotent: safe to re-run.  Creates Postgres tables, MinIO bucket,
  # and Temporal search-attributes — the same steps as `python -m scripts.setup_db`.
  init:
    build: {context: ., dockerfile: Dockerfile}
    command: ["python", "-m", "scripts.setup_db"]
    env_file: [.env]
    # The host-oriented `.env` uses localhost for backends (dev app runs on
    # the host); inside this container they must be the compose-DNS names.
    # `environment` overrides `env_file`.
    environment:
      POSTGRES_HOST: postgres
      MILVUS_HOST: milvus
      MINIO_ENDPOINT: minio:9000
      NEO4J_URI: bolt://neo4j:7687
      TEMPORAL_HOST: temporal
    restart: "no"
    profiles: ["init"]
    depends_on:
      postgres: {condition: service_healthy}
      milvus: {condition: service_healthy}
      minio: {condition: service_healthy}
      temporal: {condition: service_started}

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  neo4j_logs:
  pg_data:
  wikibase_mysql_data:
  wikibase_images:
  wikibase_wdqs_data:
  prometheus_data:
  grafana_data:
