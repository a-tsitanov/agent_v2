# LiteLLM proxy config — OpenAI upstream.
#
# To swap back to Ollama, replace the model_list entries below with
# `ollama_chat/<model>` ones pointing at `host.docker.internal:11434`
# (see git history for the qwen3:8b + nomic-embed-text setup).
#
# The OpenAI API key is read from the `OPENAI_API_KEY` env var that
# docker-compose passes through from the host `.env` — never commit
# the key here.

model_list:
  # LARGE tier (LITELLM_MODEL_LARGE).  gpt-4o-mini — cheap, fast,
  # 128k context, supports tool calling + structured outputs.  Used
  # only for the final answer synthesis role by default.
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # SMALL tier (LITELLM_MODEL_SMALL).  Local Ollama model proxied to
  # the host ollama daemon — used for every high-volume role
  # (extraction, judge, search, plan, …).
  # num_ctx: Ollama's native default (2048) truncates extraction few-shots;
  # research/entity_extraction_models found >=8k required, 16k comfortable.
  # think: false — thinking mode off for high-volume ingest roles (benched:
  # no quality win for extraction, big latency cost).
  - model_name: gemma4:e4b
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: http://host.docker.internal:11434
      num_ctx: 16384
      think: false

  # QAT variant of the SMALL tier.
  - model_name: gemma4:e4b-it-qat
    litellm_params:
      model: ollama_chat/gemma4:e4b-it-qat
      api_base: http://host.docker.internal:11434
      num_ctx: 16384
      think: false

  # E2B QAT — lighter/faster tier; what the prod-stack local test points
  # LITELLM_MODEL_SMALL/LARGE at (see .env).
  - model_name: gemma4:e2b-it-qat
    litellm_params:
      model: ollama_chat/gemma4:e2b-it-qat
      api_base: http://host.docker.internal:11434
      num_ctx: 16384
      think: false

  # Embeddings via host ollama — 768-dim; MUST match MILVUS_DIM=768 in the
  # host `.env`.  Registered under the exact name the app requests.
  - model_name: nomic-embed-text:latest
    litellm_params:
      model: ollama/nomic-embed-text:latest
      api_base: http://host.docker.internal:11434

  # Heavier escalation target for harder multi-hop / reflective work.
  # Point a tier at it via LITELLM_MODEL_LARGE=gpt-4o in the host `.env`.
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Embeddings — 1536-dim.  MUST match MILVUS_DIM in the host `.env`,
  # otherwise the vector store will reject inserts.  text-embedding-3-large
  # is 3072-dim if higher quality is needed; mirror the dim bump.
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  # Optional baseline kept for comparative R9 eval — costs more but
  # gives a quality ceiling.  Uncomment when needed.
  # - model_name: text-embedding-3-large
  #   litellm_params:
  #     model: openai/text-embedding-3-large
  #     api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  # Workaround for an upstream litellm bug: when the requested model
  # isn't found in `model_list` (or DB-store via
  # general_settings.store_model_in_db), some retry paths compare
  # `retries < router.num_retries` where `num_retries` is None when
  # not set at root level → TypeError → opaque 500.  Pin to 0 here
  # so the comparison always uses an int.  Per-model override is
  # still possible via `litellm_params.num_retries` in each entry.
  num_retries: 0

# Production setups using `general_settings.store_model_in_db: true`
# (model_list pulled from Postgres at runtime) — set the same
# `num_retries: 0` knob in `general_settings` OR via the LiteLLM
# UI's "Default Router Settings" section.  Otherwise the same
# TypeError surfaces from the DB-fetch code path.
#
# Either way, the fail-fast validator in src/observability/litellm_models.py
# (called at API + worker startup) queries GET /v1/models and warns
# loudly if LITELLM_MODEL_SMALL / LITELLM_MODEL_LARGE point at a name
# not registered in the proxy — catches the misconfig before the first
# ingest hits a 500.
