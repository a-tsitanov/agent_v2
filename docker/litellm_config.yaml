# Minimal LiteLLM proxy config — adjust upstream for your environment.
#
# Default: assumes Ollama running on the host (`OLLAMA_BASE_URL` env);
# the LiteLLM container resolves `host.docker.internal` to reach it.
# For OpenAI / Anthropic / Azure replace the model entries below.

model_list:
  - model_name: qwen2.5:3b
    litellm_params:
      model: ollama/qwen2.5:3b
      api_base: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: ${LITELLM_MASTER_KEY:-sk-litellm-stub}
