# LiteLLM proxy config for local Ollama on the host.
# Container reaches Ollama via host.docker.internal:11434.
#
# No auth — local-dev-only proxy.  In production add `general_settings.master_key`
# AND a DATABASE_URL so LiteLLM can validate keys.

model_list:
  - model_name: llama3.1:8b
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://host.docker.internal:11434
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true
  set_verbose: false
