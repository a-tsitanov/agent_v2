# LiteLLM proxy config for the prod stack.
#
# MODEL ALIASES (stable): the app requests only these two model names, set in
# .env as LITELLM_MODEL_SMALL=small / LITELLM_MODEL_LARGE=large. Switch the
# ACTUAL model HERE (this file) + `docker restart litellm` — NEVER touch .env
# or recreate app containers to change models.
#   small = high-volume tier (extraction/judge/search/plan)
#   large = final user-facing synthesis
# Embeddings: bge-m3 (1024-dim; MUST match MILVUS_DIM=1024). nomic-embed-text
# (768) kept as legacy fallback — far weaker RU retrieval discrimination.

model_list:
  # 2026-07-22: BOTH tiers consolidated onto the host.docker.internal Ollama
  # (gemma4:31b-cloud, paid "pro" tariff). The external efko/141.105 small
  # nodes were removed — everything now runs on the one paid cloud model.
  # Single physical endpoint ⇒ keep LLM_POOL_N low (=5) so batch fan-out
  # (CommunityBuild summaries) doesn't overwhelm it.
  # ---- SMALL pool ----
  - model_name: small
    litellm_params:
      model: ollama_chat/gemma4:31b-cloud
      api_base: http://host.docker.internal:11434
      num_ctx: 16384
      think: false
  # ---- LARGE pool ----
  # deepseek-v4-flash:cloud — 1M context window. Real overflow source is the
  # small-tier community-report build (summarize_community_activity, cid=0 root
  # community ~390k tokens > gemma 262144). It requests `small`; on prompt-too-
  # long litellm spills small->large, so a 1M `large` rescues it via fallback.
  - model_name: large
    litellm_params:
      model: ollama_chat/deepseek-v4-flash:cloud
      api_base: http://host.docker.internal:11434
      num_ctx: 976000
      think: false
  # ---- Embeddings ----
  # nomic-embed-text (768) is the legacy embedder; bge-m3 (1024) is the
  # current one — far better RU retrieval discrimination. MUST match MILVUS_DIM.
  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3
      api_base: http://host.docker.internal:11434
  - model_name: nomic-embed-text:latest
    litellm_params:
      model: ollama/nomic-embed-text:latest
      api_base: http://host.docker.internal:11434


litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 0

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60
  allowed_fails: 2
  cooldown_time: 300
  # Cross-tier fallback: if every deployment in one alias group fails/times out,
  # spill to the other group (both are real model_names — a fallback to a
  # non-existent group like "gemma4:12b" hard-500s instead of falling back).
  # small = gemma4:31b-cloud (262144 ctx), large = deepseek-v4-flash:cloud
  # (1M ctx) — distinct endpoints/models. Cross-fallback both ways so a
  # per-deployment cooldown spills to the other instead of hard-failing.
  # NOTE: large→small downgrades to 262144 ctx, so a >262144-token REDUCE
  # prompt that fails on large will still prompt-too-long on the small spill.
  fallbacks:
    - large: ["small"]
    - small: ["large"]
