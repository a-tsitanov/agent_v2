# LiteLLM proxy config for the prod stack.
#
# MODEL ALIASES (stable): the app requests only these two model names, set in
# .env as LITELLM_MODEL_SMALL=small / LITELLM_MODEL_LARGE=large. Switch the
# ACTUAL model HERE (this file) + `docker restart litellm` — NEVER touch .env
# or recreate app containers to change models.
#   small = high-volume tier (extraction/judge/search/plan)
#   large = final user-facing synthesis
# Embeddings: nomic-embed-text:latest (768-dim; MUST match MILVUS_DIM=768).

model_list:
  # ---- SMALL pool (2 deployments, simple-shuffle) ----
  - model_name: small
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: https://ollama.efko-smart-systems-dev.ru
      api_key: sk-change-me
      num_ctx: 16384
      think: false
  - model_name: small
    litellm_params:
      model: ollama_chat/gemma4:e4b
      api_base: http://141.105.69.136:11434
      api_key: sk-change-me
      num_ctx: 16384
      think: false
  # ---- LARGE pool (2 deployments) ----
  - model_name: large
    litellm_params:
      model: openai/gemini-2.5-flash
      api_base: https://openai.bothub.ru/v1
      api_key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6Ijc5OWQ0MzMxLWQ1MzUtNDE5Mi05YjA5LTNkM2U1Mjc3ZjI3OCIsImlzRGV2ZWxvcGVyIjp0cnVlLCJpYXQiOjE3ODQ1NTk0MDksImV4cCI6MjEwMDEzNTQwOSwianRpIjoiXzFtdEd5RjkyTDF6VmxhXyJ9.nAqdTNX0i9PE9QBjlLSB24nxDR0JNjJKd9ODvkcOhDM
  - model_name: large
    litellm_params:
      model: ollama_chat/gemma4:31b-cloud
      api_base: http://host.docker.internal:11434
      num_ctx: 16384
      think: false
  # ---- Embeddings ----
  - model_name: nomic-embed-text:latest
    litellm_params:
      model: ollama/nomic-embed-text:latest
      api_base: http://host.docker.internal:11434


litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 0

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60
  allowed_fails: 2
  cooldown_time: 300
  # Cross-tier fallback: if every deployment in one alias group fails/times out,
  # spill to the other group (both are real model_names — a fallback to a
  # non-existent group like "gemma4:12b" hard-500s instead of falling back).
  fallbacks:
    - small: ["large"]
    - large: ["small"]
