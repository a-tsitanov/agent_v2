# LiteLLM proxy config for the prod extension (docker-compose.litellm.yml).
# Both models are served by the remote ollama at
# https://ollama.efko-smart-systems-dev.ru (set via the app's LITELLM_* env).
#
# The app requests these exact model_name values (see .env):
#   LITELLM_MODEL_SMALL / LITELLM_MODEL_LARGE = gemma4:12b
#   LITELLM_EMBEDDING_MODEL                    = nomic-embed-text:latest
# MILVUS_DIM MUST be 768 (nomic-embed-text native dim) or Milvus rejects inserts.

model_list:
  # Chat / completion tier (SMALL + LARGE). ollama_chat/ transport.
  # num_ctx 16384: the 2048 default truncates extraction few-shots.
  # think:false: thinking mode off for high-volume roles (benched — no quality
  # win for extraction, big latency cost).
  - model_name: gemma4:12b
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: https://ollama.efko-smart-systems-dev.ru
      num_ctx: 16384
      think: false

  # Embeddings — 768-dim; MUST match MILVUS_DIM=768. Uses the ollama/ (NOT
  # ollama_chat/) transport — the chat transport can't serve /embeddings.
  - model_name: nomic-embed-text:latest
    litellm_params:
      model: ollama/nomic-embed-text:latest
      api_base: https://ollama.efko-smart-systems-dev.ru

litellm_settings:
  drop_params: true
  set_verbose: false
  # Pin to 0 — avoids an upstream litellm TypeError when num_retries is None at
  # root level (full explanation in docker/litellm_config.yaml).
  num_retries: 0
